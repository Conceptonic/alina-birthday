<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поздравить Алину?</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0b0f;
    --surface: #13131a;
    --border: rgba(255,255,255,0.07);
    --gold: #c9a96e;
    --gold-light: #e8c98a;
    --text: #f0ede8;
    --muted: rgba(240,237,232,0.45);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Jost', sans-serif;
    overflow: hidden;
  }

  #particles {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px;
  }

  .scene {
    position: relative; z-index: 10;
    height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem;
    gap: 3.5rem;
  }

  .question {
    text-align: center;
    opacity: 0;
    animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.2s forwards;
  }
  .question h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 8vw, 5.5rem);
    font-weight: 300;
    line-height: 1.05;
    letter-spacing: 0.05em;
    color: var(--text);
  }
  .divider {
    width: 50px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 1.8rem auto 0;
  }

  .buttons-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    opacity: 0;
    animation: fadeUp 0.8s cubic-bezier(0.22,1,0.36,1) 0.55s forwards;
  }

  .btn {
    width: 130px;
    height: 60px;
    border-radius: 0.9rem;
    border: none;
    font-family: 'Jost', sans-serif;
    font-size: 1.15rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    cursor: pointer;
    flex-shrink: 0;
  }

  #btnDa {
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--bg);
    box-shadow: 0 4px 24px rgba(201,169,110,0.25);
    /* начинает как обычный элемент в потоке */
  }

  #btnNet {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    transition: border-color 0.2s, color 0.2s;
  }
  #btnNet:hover {
    border-color: rgba(255,255,255,0.18);
    color: var(--text);
  }

  /* Плейсхолдер — занимает место ДА после того как та улетела */
  #daPlaceholder {
    width: 130px;
    height: 60px;
    flex-shrink: 0;
    display: none;
  }

  .goodbye {
    display: none;
    text-align: center;
  }
  .goodbye.show {
    display: block;
    animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .goodbye h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 8vw, 5.5rem);
    font-weight: 300;
    line-height: 1.05;
    letter-spacing: 0.05em;
    color: var(--text);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="scene">
  <div class="question" id="questionBlock">
    <h1>ХОТИТЕ ПОЗДРАВИТЬ<br>АЛИНУ С ДНЁМ<br>РОЖДЕНИЯ?</h1>
    <div class="divider"></div>
  </div>

  <div class="buttons-area" id="buttonsArea">
    <div id="daPlaceholder"></div>
    <button class="btn" id="btnDa" onmouseover="runAway()">ДА</button>
    <button class="btn" id="btnNet" onclick="sayGoodbye()">НЕТ</button>
  </div>

  <div class="goodbye" id="goodbye">
    <h1>ДО<br>СВИДАНИЯ!</h1>
  </div>
</div>

<script>
// ── PARTICLES ──────────────────────────────────────────────────────────────
var canvas = document.getElementById('particles');
var ctx = canvas.getContext('2d');
var W, H, pts = [];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  pts = [];
  for (var i = 0, n = Math.floor((W * H) / 15000); i < n; i++) {
    pts.push({
      ox: Math.random()*W, oy: Math.random()*H,
      a: Math.random()*Math.PI*2,
      sp: 0.007 + Math.random()*0.01,
      rad: 25 + Math.random()*55,
      r: 0.4 + Math.random()*0.8
    });
  }
}
resize();
window.addEventListener('resize', resize);

(function loop() {
  ctx.clearRect(0,0,W,H);
  for (var i = 0; i < pts.length; i++) {
    var p = pts[i];
    p.a += p.sp;
    ctx.beginPath();
    ctx.arc(p.ox + Math.cos(p.a)*p.rad, p.oy + Math.sin(p.a)*p.rad, p.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(201,169,110,' + (0.08 + Math.random()*0.13) + ')';
    ctx.fill();
  }
  requestAnimationFrame(loop);
})();

// ── КНОПКА ДА ─────────────────────────────────────────────────────────────
var btnDa   = document.getElementById('btnDa');
var BW = 130, BH = 60, M = 20;
var isFixed = false;

function runAway() {
  if (!isFixed) {
    var rect = btnDa.getBoundingClientRect();

    document.getElementById('daPlaceholder').style.display = 'block';

    // Переносим в body — иначе position:fixed работает относительно
    // трансформированного родителя (.buttons-area имеет анимацию с transform)
    document.body.appendChild(btnDa);

    btnDa.style.position = 'fixed';
    btnDa.style.width    = BW + 'px';
    btnDa.style.height   = BH + 'px';
    btnDa.style.left     = rect.left + 'px';
    btnDa.style.top      = rect.top  + 'px';
    btnDa.style.margin   = '0';
    btnDa.style.zIndex   = '100';

    isFixed = true;
  }

  // Улетаем в случайное место
  var maxX = window.innerWidth  - BW - M;
  var maxY = window.innerHeight - BH - M;
  var curX = parseFloat(btnDa.style.left);
  var curY = parseFloat(btnDa.style.top);
  var newX, newY, attempts = 0;

  do {
    newX = M + Math.random() * maxX;
    newY = M + Math.random() * maxY;
    attempts++;
  } while (attempts < 10 && Math.abs(newX - curX) < 150 && Math.abs(newY - curY) < 100);

  btnDa.style.left = newX + 'px';
  btnDa.style.top  = newY + 'px';
}

// ── НЕТ ────────────────────────────────────────────────────────────────────
function sayGoodbye() {
  document.getElementById('questionBlock').style.display = 'none';
  document.getElementById('buttonsArea').style.display   = 'none';
  btnDa.style.display = 'none';
  document.getElementById('goodbye').classList.add('show');
}
</script>
</body>
</html>
